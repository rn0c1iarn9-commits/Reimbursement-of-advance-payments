<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>立替精算</title>

<style>
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  margin:0;background:#f5f7fb;color:#222;-webkit-tap-highlight-color:transparent
}
.fixed-header{position:sticky;top:0;z-index:1000;background:#f5f7fb;padding-bottom:5px}
.nav-buttons{position:relative;display:flex;justify-content:center;align-items:center;padding:8px 12px}
h2{margin:0;font-size:18px;font-weight:600}
.header-actions{position:absolute;right:12px;display:flex;gap:6px}
.header-btn{width:40px;height:34px;border:none;border-radius:9px;background:#fff;color:#555;box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:16px}
.clear-btn{color:#d64545}.csv-btn{color:#3478db}
button{border:none;border-radius:10px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;transition:.15s}
button:active{transform:scale(.96)}

/* 合計 */
.summary{padding:0 10px 7px}
.summary-card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.summary-title{font-size:11px;color:#888;margin-bottom:7px}
.total-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.person-total{border-radius:10px;padding:7px 9px;background:#f6f7fb}
.person-label{font-size:11px;color:#777;margin-bottom:1px}
.person-money{font-size:18px;font-weight:700}
.husband{color:#3478db}.wife{color:#e35b78}
.settlement{margin-top:7px;border-radius:10px;padding:7px;background:#eef5ff;text-align:center}
.settlement-label{font-size:10px;color:#777;margin-bottom:2px}
.settlement-result{font-size:16px;font-weight:700;color:#245ca8}
.settlement.none{background:#edf8ef}.settlement.none .settlement-result{color:#2d8245}

/* 入力 */
.input-section{padding:0 10px 7px}
.input-card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.person-selector{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.person-selector input{display:none}
.person-selector label{padding:7px;text-align:center;border-radius:9px;background:#f2f3f7;font-size:13px;font-weight:600;cursor:pointer}
.person-selector input:checked+label.husband-label{background:#dbe9ff;color:#245ca8}
.person-selector input:checked+label.wife-label{background:#ffe1e8;color:#c14360}

.name-input-wrap{position:relative}
input[type="text"]{
  width:100%;padding:9px 42px 9px 10px;border:none;border-radius:9px;
  background:#f6f7fb;font-size:15px;outline:none
}
.voice-btn{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:34px;height:32px;background:transparent;box-shadow:none;color:#555;font-size:17px
}
.voice-btn.listening{color:#e35b78;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translateY(-50%) scale(1.12)}}

/* 電卓表示 */
.calculator-display{
  position:relative;margin-top:7px;min-height:48px;border-radius:10px;
  background:#f6f7fb;padding:5px 43px 5px 10px;text-align:right;overflow:hidden
}
.expression{height:15px;color:#999;font-size:11px;white-space:nowrap;overflow:hidden}
.amount-display{font-size:23px;font-weight:700;line-height:27px;white-space:nowrap;overflow:hidden}
.amount-voice-btn{
  position:absolute;right:4px;bottom:5px;width:34px;height:30px;
  background:transparent;box-shadow:none;color:#555;font-size:17px
}
.amount-voice-btn.listening{color:#e35b78;animation:pulseAmount 1s infinite}
@keyframes pulseAmount{50%{transform:scale(1.12)}}

/* 電卓 */
.calculator{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
.calc-btn{min-height:42px;border-radius:9px;background:#f6f7fb;font-size:18px;font-weight:500}
.calc-btn.operator{background:#eaf1ff;color:#245ca8}
.calc-btn.equal{background:#4f8cff;color:#fff}
.calc-btn.clear{color:#d64545}
.calc-btn.toggle{font-size:12px;font-weight:700;background:#eef5ff;color:#245ca8}
.calc-btn.toggle.full{background:#fff0d9;color:#b56b00}

/* 登録 */
.register-btn{
  width:100%;margin-top:7px;padding:10px;background:#4f8cff;color:#fff;
  font-size:15px;font-weight:700;border-radius:10px;box-shadow:0 3px 10px rgba(79,140,255,.25)
}

/* 明細 */
.detail-section{padding:0 10px 25px}
.detail-card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.detail-title{font-size:14px;font-weight:600}.detail-count{font-size:10px;color:#999}
.detail-list{display:flex;flex-direction:column;gap:5px}
.detail-item{
  display:flex;align-items:center;min-height:48px;padding:7px 8px;
  background:#f7f8fb;border-radius:9px;cursor:pointer
}
.detail-item:active{background:#edf2fa}
.detail-person{width:32px;font-size:10px;font-weight:700}
.detail-content{flex:1;min-width:0}
.detail-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-date{font-size:9px;color:#999;margin-top:1px}
.detail-amount{display:flex;flex-direction:column;align-items:flex-end;margin-left:6px;white-space:nowrap}
.detail-amount-value{font-size:14px;font-weight:700}
.settlement-badge{display:inline-block;margin-top:1px;padding:1px 4px;border-radius:4px;font-size:8px;font-weight:600}
.settlement-badge.split{background:#eaf1ff;color:#3478db}
.settlement-badge.full{background:#fff0d9;color:#b56b00}
.delete-item{width:28px;height:28px;margin-left:5px;background:transparent;box-shadow:none;color:#aaa;font-size:16px}
.empty{padding:18px 10px;text-align:center;color:#aaa;font-size:12px}
.edit-hint{font-size:9px;color:#aaa;text-align:right;margin-top:5px}

@media(max-width:360px){
  .calc-btn{min-height:39px;font-size:17px}
  .amount-display{font-size:21px}
  .summary-card,.input-card,.detail-card{padding:9px}
}
</style>
</head>

<body>

<div class="fixed-header">
  <div class="nav-buttons">
    <h2>立替精算</h2>
    <div class="header-actions">
      <button class="header-btn csv-btn" onclick="exportCSV()" aria-label="CSV出力">📄</button>
      <button class="header-btn clear-btn" onclick="clearAll()" aria-label="全データ削除">🗑️</button>
    </div>
  </div>
</div>

<section class="summary">
  <div class="summary-card">
    <div class="summary-title">現在の支払い状況</div>
    <div class="total-row">
      <div class="person-total">
        <div class="person-label">一正の支払い</div>
        <div id="husbandTotal" class="person-money husband">0円</div>
      </div>
      <div class="person-total">
        <div class="person-label">皐月の支払い</div>
        <div id="wifeTotal" class="person-money wife">0円</div>
      </div>
    </div>
    <div id="settlementBox" class="settlement">
      <div class="settlement-label">精算</div>
      <div id="settlementResult" class="settlement-result">まだ支払いがありません</div>
    </div>
  </div>
</section>

<section class="input-section">
  <div class="input-card">

    <div class="person-selector">
      <input type="radio" id="payerHusband" name="payer" value="husband" checked>
      <label for="payerHusband" class="husband-label">👨 一正</label>
      <input type="radio" id="payerWife" name="payer" value="wife">
      <label for="payerWife" class="wife-label">👩 皐月</label>
    </div>

    <div class="name-input-wrap">
      <input type="text" id="itemName" placeholder="支払い名目（例：新幹線）" maxlength="50">
      <button class="voice-btn" id="nameVoiceBtn" onclick="startVoiceInput('name')" aria-label="名目を音声入力">🎙️</button>
    </div>

    <div class="calculator-display">
      <div id="expression" class="expression"></div>
      <div id="amountDisplay" class="amount-display">0</div>
      <button class="amount-voice-btn" id="amountVoiceBtn" onclick="startVoiceInput('amount')" aria-label="金額を音声入力">🎙️</button>
    </div>

    <div class="calculator">

      <button class="calc-btn clear" onclick="clearCalculator()">AC</button>
      <button class="calc-btn" onclick="backspace()">⌫</button>
      <button id="settlementToggle" class="calc-btn toggle" onclick="toggleSettlementType()">割勘</button>
      <button class="calc-btn operator" onclick="inputOperator('÷')">÷</button>

      <button class="calc-btn" onclick="inputNumber('7')">7</button>
      <button class="calc-btn" onclick="inputNumber('8')">8</button>
      <button class="calc-btn" onclick="inputNumber('9')">9</button>
      <button class="calc-btn operator" onclick="inputOperator('×')">×</button>

      <button class="calc-btn" onclick="inputNumber('4')">4</button>
      <button class="calc-btn" onclick="inputNumber('5')">5</button>
      <button class="calc-btn" onclick="inputNumber('6')">6</button>
      <button class="calc-btn operator" onclick="inputOperator('-')">−</button>

      <button class="calc-btn" onclick="inputNumber('1')">1</button>
      <button class="calc-btn" onclick="inputNumber('2')">2</button>
      <button class="calc-btn" onclick="inputNumber('3')">3</button>
      <button class="calc-btn operator" onclick="inputOperator('+')">＋</button>

      <button class="calc-btn" onclick="inputNumber('0')">0</button>
      <button class="calc-btn" onclick="inputNumber('00')">00</button>
      <button class="calc-btn" onclick="inputNumber('000')">000</button>
      <button class="calc-btn equal" onclick="calculate()">＝</button>

    </div>

    <button id="registerBtn" class="register-btn" onclick="registerPayment()">＋ 支払いを登録</button>
  </div>
</section>

<section class="detail-section">
  <div class="detail-card">
    <div class="detail-header">
      <div class="detail-title">支払い明細</div>
      <div id="detailCount" class="detail-count">0件</div>
    </div>
    <div id="detailList" class="detail-list"></div>
    <div id="editHint" class="edit-hint" style="display:none">明細をタップすると編集できます</div>
  </div>
</section>

<script>
const STORAGE_KEY="couple-travel-expense-v1";
let payments=[];
try{const saved=localStorage.getItem(STORAGE_KEY);if(saved)payments=JSON.parse(saved)}catch(e){console.error(e);payments=[]}

let calculatorValue="0",firstValue=null,currentOperator=null,waitingForSecondValue=false,expressionText="";
let settlementType="split";
let editingId=null;
let editingOriginalName="";
let recognition=null;
let voiceTarget=null;

const amountDisplay=document.getElementById("amountDisplay");
const expression=document.getElementById("expression");
const itemName=document.getElementById("itemName");
const registerBtn=document.getElementById("registerBtn");

function savePayments(){localStorage.setItem(STORAGE_KEY,JSON.stringify(payments))}
function formatMoney(value){return Math.round(value).toLocaleString("ja-JP")+"円"}

function updateCalculatorDisplay(){
  const n=Number(calculatorValue);
  amountDisplay.textContent=Number.isFinite(n)?n.toLocaleString("ja-JP"):calculatorValue;
  expression.textContent=expressionText;
}

function inputNumber(num){
  if(waitingForSecondValue){calculatorValue=num;waitingForSecondValue=false}
  else if(calculatorValue==="0"){
    calculatorValue=(num==="00"||num==="000")?"0":num;
  }else calculatorValue+=num;
  updateCalculatorDisplay();
}

function inputOperator(operator){
  const inputValue=Number(calculatorValue);
  if(!Number.isFinite(inputValue))return;

  if(firstValue!==null&&currentOperator&&!waitingForSecondValue){
    const result=performCalculation(firstValue,inputValue,currentOperator);
    if(result===null)return;
    calculatorValue=String(result);firstValue=result;
  }else firstValue=inputValue;

  currentOperator=operator;
  waitingForSecondValue=true;
  expressionText=`${formatNumberForExpression(firstValue)} ${operator}`;
  updateCalculatorDisplay();
}

function calculate(){
  if(firstValue===null||currentOperator===null||waitingForSecondValue)return;
  const secondValue=Number(calculatorValue);
  const result=performCalculation(firstValue,secondValue,currentOperator);
  if(result===null)return;

  expressionText=`${formatNumberForExpression(firstValue)} ${currentOperator} ${formatNumberForExpression(secondValue)} =`;
  calculatorValue=String(result);
  firstValue=null;currentOperator=null;waitingForSecondValue=true;
  updateCalculatorDisplay();
}

function performCalculation(a,b,operator){
  switch(operator){
    case "+":return a+b;
    case "-":return a-b;
    case "×":return a*b;
    case "÷":
      if(b===0){alert("0で割ることはできません。");clearCalculator();return null}
      return a/b;
    default:return b;
  }
}

function clearCalculator(){
  calculatorValue="0";firstValue=null;currentOperator=null;waitingForSecondValue=false;expressionText="";
  updateCalculatorDisplay();
}

function backspace(){
  if(waitingForSecondValue)return;
  calculatorValue=calculatorValue.length<=1?"0":calculatorValue.slice(0,-1);
  updateCalculatorDisplay();
}

function formatNumberForExpression(value){return Number(value).toLocaleString("ja-JP")}

function setSettlementType(type){
  if(type!=="split"&&type!=="full")return;
  settlementType=type;
  const btn=document.getElementById("settlementToggle");
  btn.textContent=type==="split"?"割勘（1/2）":"全額";
  btn.classList.toggle("full",type==="full");
}

function toggleSettlementType(){
  setSettlementType(settlementType==="split"?"full":"split");
}

function getSettlementAmount(payment){
  return (payment.settlementType||"split")==="full"?payment.amount:payment.amount/2;
}

/* 登録・更新 */
function registerPayment(){
  const payer=document.querySelector('input[name="payer"]:checked').value;
  const name=itemName.value.trim();
  let amount=Number(calculatorValue);

  if(firstValue!==null&&currentOperator!==null&&!waitingForSecondValue){
    calculate();amount=Number(calculatorValue);
  }

  if(!name){alert("支払い名目を入力してください。");itemName.focus();return}
  if(!Number.isFinite(amount)||amount<=0){alert("1円以上の金額を入力してください。");return}

  /* 編集中かつ名目が変わっていない場合は同じ明細を更新 */
  if(editingId&&name===editingOriginalName){
    const index=payments.findIndex(p=>p.id===editingId);
    if(index!==-1){
      payments[index].payer=payer;
      payments[index].amount=amount;
      payments[index].settlementType=settlementType;
      savePayments();render();
      resetInput();
      return;
    }
  }

  /* 名目を変更した場合、または通常登録の場合は新規追加 */
  payments.push({
    id:Date.now().toString()+Math.random().toString(16).slice(2),
    payer,name,amount,settlementType,
    createdAt:new Date().toISOString()
  });

  savePayments();render();resetInput();
}

function resetInput(){
  itemName.value="";
  clearCalculator();
  setSettlementType("split");
  editingId=null;
  editingOriginalName="";
  registerBtn.textContent="＋ 支払いを登録";
  itemName.focus();
}

/* 明細編集 */
function editPayment(id){
  const payment=payments.find(p=>p.id===id);
  if(!payment)return;

  editingId=payment.id;
  editingOriginalName=payment.name;

  document.querySelector(`input[name="payer"][value="${payment.payer}"]`).checked=true;
  itemName.value=payment.name;
  calculatorValue=String(Math.round(payment.amount));
  firstValue=null;currentOperator=null;waitingForSecondValue=true;expressionText="";
  setSettlementType(payment.settlementType||"split");
  updateCalculatorDisplay();

  registerBtn.textContent="更新";
  document.querySelector(".input-section").scrollIntoView({behavior:"smooth",block:"start"});
  setTimeout(()=>itemName.focus(),300);
}

function deletePayment(id){
  const payment=payments.find(item=>item.id===id);
  if(!payment)return;

  if(!confirm(`「${payment.name}」${formatMoney(payment.amount)}を削除しますか？`))return;

  payments=payments.filter(item=>item.id!==id);

  if(editingId===id)resetInput();

  savePayments();render();
}

function clearAll(){
  if(payments.length===0){alert("削除するデータがありません。");return}
  if(!confirm("登録した支払いをすべて削除します。\n\nこの操作は元に戻せません。よろしいですか？"))return;
  payments=[];resetInput();savePayments();render();
}

/* 名目を変更した時点で編集モードを解除 */
itemName.addEventListener("input",()=>{
  if(editingId&&itemName.value!==editingOriginalName){
    editingId=null;
    editingOriginalName="";
    registerBtn.textContent="＋ 支払いを登録";
  }
});

function calculateTotals(){
  let husbandTotal=0,wifeTotal=0;
  payments.forEach(payment=>{
    const amount=getSettlementAmount(payment);
    if(payment.payer==="husband")husbandTotal+=amount;
    else wifeTotal+=amount;
  });
  return{husbandTotal,wifeTotal};
}

function renderSettlement(husbandTotal,wifeTotal){
  const box=document.getElementById("settlementBox");
  const result=document.getElementById("settlementResult");
  const difference=husbandTotal-wifeTotal;

  box.classList.remove("none");

  if(husbandTotal===0&&wifeTotal===0){
    result.textContent="まだ支払いがありません";return;
  }

  if(Math.abs(difference)<0.000001){
    result.textContent="精算なし（支払額は同じです）";
    box.classList.add("none");return;
  }

  const settlement=Math.abs(difference);

  result.textContent=difference>0
    ?`皐月 → 一正へ ${formatMoney(settlement)}`
    :`一正 → 皐月へ ${formatMoney(settlement)}`;
}

function renderDetails(){
  const list=document.getElementById("detailList");
  const count=document.getElementById("detailCount");
  count.textContent=`${payments.length}件`;
  list.innerHTML="";

  if(payments.length===0){
    list.innerHTML=`<div class="empty">まだ支払いが登録されていません</div>`;
    document.getElementById("editHint").style.display="none";
    return;
  }

  document.getElementById("editHint").style.display="block";

  [...payments].reverse().forEach(payment=>{
    const item=document.createElement("div");
    item.className="detail-item";
    item.onclick=()=>editPayment(payment.id);

    const person=document.createElement("div");
    person.className="detail-person "+(payment.payer==="husband"?"husband":"wife");
    person.textContent=payment.payer==="husband"?"一正":"皐月";

    const content=document.createElement("div");
    content.className="detail-content";

    const name=document.createElement("div");
    name.className="detail-name";
    name.textContent=payment.name;

    const date=document.createElement("div");
    date.className="detail-date";
    date.textContent=formatDate(payment.createdAt);

    content.append(name,date);

    const amount=document.createElement("div");
    amount.className="detail-amount";

    const amountValue=document.createElement("div");
    amountValue.className="detail-amount-value";
    amountValue.textContent=formatMoney(payment.amount);

    const badge=document.createElement("span");
    const type=payment.settlementType||"split";
    badge.className="settlement-badge "+(type==="full"?"full":"split");
    badge.textContent=type==="full"?"全額":"割勘";

    amount.append(amountValue,badge);

    const deleteButton=document.createElement("button");
    deleteButton.className="delete-item";
    deleteButton.textContent="×";
    deleteButton.onclick=e=>{
      e.stopPropagation();
      deletePayment(payment.id);
    };

    item.append(person,content,amount,deleteButton);
    list.appendChild(item);
  });
}

function formatDate(dateString){
  const date=new Date(dateString);
  if(Number.isNaN(date.getTime()))return "";

  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");
  const h=String(date.getHours()).padStart(2,"0");
  const min=String(date.getMinutes()).padStart(2,"0");

  return `${y}/${m}/${d} ${h}:${min}`;
}

/* CSV */
function escapeCSV(value){
  const text=String(value??"");
  return /[,"\r\n]/.test(text)?`"${text.replace(/"/g,'""')}"`:text;
}

function exportCSV(){
  if(payments.length===0){alert("CSV出力する支払いデータがありません。");return}

  const headers=["登録日時","支払者","支払い名目","支払額","精算区分","精算対象額"];
  const rows=payments.map(payment=>[
    formatDate(payment.createdAt),
    payment.payer==="husband"?"一正":"皐月",
    payment.name,
    Math.round(payment.amount),
    (payment.settlementType||"split")==="full"?"全額":"割勘",
    Math.round(getSettlementAmount(payment))
  ]);

  const csv="\uFEFF"+[
    headers.map(escapeCSV).join(","),
    ...rows.map(row=>row.map(escapeCSV).join(","))
  ].join("\r\n");

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  const now=new Date();
  const fileDate=now.getFullYear()+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0");

  link.href=url;
  link.download=`立替精算_${fileDate}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* 音声入力 */
function startVoiceInput(target){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("このブラウザは音声入力に対応していません。iPhoneではSafari、AndroidではChromeなどの対応ブラウザをご利用ください。");
    return;
  }

  if(recognition){
    try{recognition.stop()}catch(e){}
    recognition=null;
    stopVoiceUI();
  }

  voiceTarget=target;
  recognition=new SpeechRecognition();
  recognition.lang="ja-JP";
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=3;

  const button=target==="name"
    ?document.getElementById("nameVoiceBtn")
    :document.getElementById("amountVoiceBtn");

  button.classList.add("listening");

  recognition.onresult=e=>{
    const text=e.results[0][0].transcript.trim();

    if(target==="name"){
      itemName.value=text;
      if(editingId&&text!==editingOriginalName){
        editingId=null;
        editingOriginalName="";
        registerBtn.textContent="＋ 支払いを登録";
      }
    }else{
      const amount=parseSpokenAmount(text);
      if(amount===null){
        alert(`金額を認識できませんでした。\n認識結果：「${text}」`);
      }else{
        calculatorValue=String(amount);
        firstValue=null;
        currentOperator=null;
        waitingForSecondValue=true;
        expressionText="";
        updateCalculatorDisplay();
      }
    }
  };

  recognition.onerror=e=>{
    if(e.error!=="no-speech"&&e.error!=="aborted"){
      alert("音声を認識できませんでした。もう一度お試しください。");
    }
  };

  recognition.onend=()=>{
    stopVoiceUI();
    recognition=null;
    voiceTarget=null;
  };

  try{recognition.start()}catch(e){
    stopVoiceUI();
    recognition=null;
  }
}

function stopVoiceUI(){
  document.getElementById("nameVoiceBtn").classList.remove("listening");
  document.getElementById("amountVoiceBtn").classList.remove("listening");
}

/* 音声から金額を取り出す */
function parseSpokenAmount(text){
  let s=text.trim().replace(/[円¥￥,\s]/g,"");
  if(!s)return null;

  /* 普通の数字 */
  const numeric=s.match(/-?\d+(?:\.\d+)?/);
  if(numeric&&/^\d+(?:\.\d+)?$/.test(s)){
    const n=Number(numeric[0]);
    return Number.isFinite(n)&&n>0?Math.round(n):null;
  }

  /* 「1万2000」「1万2千」など */
  const match=s.match(/^(?:(\d+)億)?(?:(\d+)万)?(?:(\d+)千)?(?:(\d+)百)?(?:(\d+)十)?(\d+)?$/);

  if(match){
    const oku=Number(match[1]||0);
    const man=Number(match[2]||0);
    const sen=Number(match[3]||0);
    const hyaku=Number(match[4]||0);
    const ju=Number(match[5]||0);
    const ichi=Number(match[6]||0);

    const result=oku*100000000+man*10000+sen*1000+hyaku*100+ju*10+ichi;
    return result>0?result:null;
  }

  /* 音声認識が「千円」「1万円」などにした場合 */
  const unitMatch=s.match(/^(\d+)(万|千|百|十)$/);
  if(unitMatch){
    const n=Number(unitMatch[1]);
    const unit={万:10000,千:1000,百:100,十:10}[unitMatch[2]];
    const result=n*unit;
    return result>0?result:null;
  }

  return null;
}

/* キーボード */
document.addEventListener("keydown",event=>{
  const target=event.target;
  const isTextInput=target instanceof HTMLInputElement||
    target instanceof HTMLTextAreaElement||
    target.isContentEditable;

  if(isTextInput)return;

  const key=event.key;

  if(/^[0-9]$/.test(key)){inputNumber(key);return}
  if(key==="+"||key==="-"){inputOperator(key);return}
  if(key==="*"){inputOperator("×");return}
  if(key==="/"){event.preventDefault();inputOperator("÷");return}
  if(key==="Enter"||key==="="){calculate();return}
  if(key==="Backspace"){backspace();return}
  if(key==="Escape"){clearCalculator()}
});

  document.getElementById("wifeTotal").textContent=formatMoney(totals.wifeTotal);

  renderSettlement(totals.husbandTotal,totals.wifeTotal);
  renderDetails();
}
