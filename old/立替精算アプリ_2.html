<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>立替精算</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Helvetica Neue",
    sans-serif;

  margin: 0;
  background: #f5f7fb;
  color: #222;
  -webkit-tap-highlight-color: transparent;
}

/* =========================
   ヘッダー
========================= */

.fixed-header {
  position: sticky;
  top: 0;
  z-index: 1000;

  background: #f5f7fb;
  padding-bottom: 8px;
}

.nav-buttons {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;

  padding: 10px 12px;
}

h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}

.header-actions {
  position: absolute;
  right: 12px;

  display: flex;
  gap: 6px;
}

.header-btn {
  width: 42px;
  height: 36px;

  border: none;
  border-radius: 10px;

  background: #fff;
  color: #555;

  box-shadow: 0 2px 6px rgba(0,0,0,0.08);

  font-size: 16px;
}

.clear-btn {
  color: #d64545;
}

.csv-btn {
  color: #3478db;
}

button {
  border: none;
  border-radius: 10px;

  background: #fff;

  box-shadow: 0 2px 6px rgba(0,0,0,0.08);

  cursor: pointer;

  transition: 0.15s;
}

button:active {
  transform: scale(0.96);
}

/* =========================
   合計・精算エリア
========================= */

.summary {
  padding: 0 10px 10px;
}

.summary-card {
  background: #fff;
  border-radius: 16px;

  padding: 14px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.summary-title {
  font-size: 12px;
  color: #888;
  margin-bottom: 10px;
}

.total-row {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;
}

.person-total {
  border-radius: 12px;
  padding: 10px;

  background: #f6f7fb;
}

.person-label {
  font-size: 12px;
  color: #777;
  margin-bottom: 3px;
}

.person-money {
  font-size: 20px;
  font-weight: 700;
}

.husband {
  color: #3478db;
}

.wife {
  color: #e35b78;
}

.settlement {
  margin-top: 10px;

  border-radius: 12px;

  padding: 12px;

  background: #eef5ff;

  text-align: center;
}

.settlement-label {
  font-size: 11px;
  color: #777;
  margin-bottom: 4px;
}

.settlement-result {
  font-size: 18px;
  font-weight: 700;
  color: #245ca8;
}

.settlement.none {
  background: #edf8ef;
}

.settlement.none .settlement-result {
  color: #2d8245;
}

/* =========================
   入力エリア
========================= */

.input-section {
  padding: 0 10px 10px;
}

.input-card {
  background: #fff;
  border-radius: 16px;

  padding: 14px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

/* 支払者 */

.person-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;

  margin-bottom: 10px;
}

.person-selector input {
  display: none;
}

.person-selector label {
  padding: 10px;

  text-align: center;

  border-radius: 10px;

  background: #f2f3f7;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  transition: 0.15s;
}

.person-selector input:checked + label.husband-label {
  background: #dbe9ff;
  color: #245ca8;
}

.person-selector input:checked + label.wife-label {
  background: #ffe1e8;
  color: #c14360;
}

/* 名目 */

input[type="text"] {
  width: 100%;

  padding: 12px;

  border: none;
  border-radius: 10px;

  background: #f6f7fb;

  font-size: 16px;

  outline: none;
}

/* 電卓表示 */

.calculator-display {
  margin-top: 10px;

  min-height: 64px;

  border-radius: 12px;

  background: #f6f7fb;

  padding: 8px 12px;

  text-align: right;

  overflow: hidden;
}

.expression {
  height: 20px;

  color: #999;

  font-size: 13px;

  white-space: nowrap;
  overflow: hidden;
}

.amount-display {
  font-size: 27px;
  font-weight: 700;

  white-space: nowrap;
  overflow: hidden;
}

/* =========================
   割勘・全額
========================= */

.settlement-type-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-top: 10px;
}

.settlement-type-btn {
  min-height: 42px;

  border-radius: 10px;

  background: #f2f3f7;

  color: #777;

  font-size: 14px;
  font-weight: 600;

  box-shadow: none;
}

.settlement-type-btn.active {
  background: #eaf1ff;
  color: #245ca8;

  box-shadow: inset 0 0 0 2px #4f8cff;
}

/* =========================
   電卓
========================= */

.calculator {
  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 7px;

  margin-top: 10px;
}

.calc-btn {
  min-height: 52px;

  border-radius: 12px;

  background: #f6f7fb;

  font-size: 20px;
  font-weight: 500;
}

.calc-btn.operator {
  background: #eaf1ff;
  color: #245ca8;
}

.calc-btn.equal {
  background: #4f8cff;
  color: white;
}

.calc-btn.clear {
  color: #d64545;
}

.calc-btn.zero {
  grid-column: span 2;
}

/* 登録 */

.register-btn {
  width: 100%;

  margin-top: 10px;

  padding: 14px;

  background: #4f8cff;

  color: white;

  font-size: 16px;
  font-weight: 700;

  border-radius: 12px;

  box-shadow: 0 3px 10px rgba(79,140,255,0.25);
}

/* =========================
   明細
========================= */

.detail-section {
  padding: 0 10px 30px;
}

.detail-card {
  background: #fff;
  border-radius: 16px;

  padding: 14px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.detail-header {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin-bottom: 8px;
}

.detail-title {
  font-size: 15px;
  font-weight: 600;
}

.detail-count {
  font-size: 11px;
  color: #999;
}

.detail-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.detail-item {
  display: flex;

  align-items: center;

  min-height: 54px;

  padding: 8px 10px;

  background: #f7f8fb;

  border-radius: 10px;
}

.detail-person {
  width: 34px;

  font-size: 11px;
  font-weight: 700;
}

.detail-content {
  flex: 1;

  min-width: 0;
}

.detail-name {
  font-size: 14px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.detail-date {
  font-size: 10px;
  color: #999;

  margin-top: 2px;
}

.detail-amount {
  display: flex;
  flex-direction: column;
  align-items: flex-end;

  margin-left: 8px;

  white-space: nowrap;
}

.detail-amount-value {
  font-size: 15px;
  font-weight: 700;
}

.settlement-badge {
  display: inline-block;

  margin-top: 2px;
  padding: 2px 5px;

  border-radius: 5px;

  font-size: 9px;
  font-weight: 600;

  line-height: 1.2;
}

.settlement-badge.split {
  background: #eaf1ff;
  color: #3478db;
}

.settlement-badge.full {
  background: #fff0d9;
  color: #b56b00;
}

.delete-item {
  width: 30px;
  height: 30px;

  margin-left: 6px;

  background: transparent;

  box-shadow: none;

  color: #aaa;

  font-size: 16px;
}

.empty {
  padding: 20px 10px;

  text-align: center;

  color: #aaa;

  font-size: 13px;
}

/* =========================
   小さい画面
========================= */

@media (max-width: 360px) {

  .calc-btn {
    min-height: 48px;
    font-size: 18px;
  }

  .amount-display {
    font-size: 24px;
  }

  .settlement-type-btn {
    font-size: 13px;
  }

}
</style>
</head>

<body>

<!-- =========================
     ヘッダー
========================= -->

<div class="fixed-header">

  <div class="nav-buttons">

    <h2>立替精算</h2>

    <div class="header-actions">

      <button
        class="header-btn csv-btn"
        onclick="exportCSV()"
        aria-label="CSV出力"
        title="CSV出力">
        📄
      </button>

      <button
        class="header-btn clear-btn"
        onclick="clearAll()"
        aria-label="全データ削除"
        title="全データ削除">
        🗑️
      </button>

    </div>

  </div>

</div>


<!-- =========================
     合計
========================= -->

<section class="summary">

  <div class="summary-card">

    <div class="summary-title">
      現在の支払い状況
    </div>

    <div class="total-row">

      <div class="person-total">

        <div class="person-label">
          一正の支払い
        </div>

        <div
          id="husbandTotal"
          class="person-money husband">
          0円
        </div>

      </div>


      <div class="person-total">

        <div class="person-label">
          皐月の支払い
        </div>

        <div
          id="wifeTotal"
          class="person-money wife">
          0円
        </div>

      </div>

    </div>


    <div
      id="settlementBox"
      class="settlement">

      <div class="settlement-label">
        精算
      </div>

      <div
        id="settlementResult"
        class="settlement-result">
        まだ支払いがありません
      </div>

    </div>

  </div>

</section>


<!-- =========================
     入力
========================= -->

<section class="input-section">

  <div class="input-card">

    <!-- 支払者 -->

    <div class="person-selector">

      <input
        type="radio"
        id="payerHusband"
        name="payer"
        value="husband"
        checked>

      <label
        for="payerHusband"
        class="husband-label">
        👨 一正
      </label>


      <input
        type="radio"
        id="payerWife"
        name="payer"
        value="wife">

      <label
        for="payerWife"
        class="wife-label">
        👩 皐月
      </label>

    </div>


    <!-- 名目 -->

    <input
      type="text"
      id="itemName"
      placeholder="支払い名目（例：新幹線）"
      maxlength="50">


    <!-- 電卓表示 -->

    <div class="calculator-display">

      <div
        id="expression"
        class="expression">
      </div>

      <div
        id="amountDisplay"
        class="amount-display">
        0
      </div>

    </div>


    <!-- 割勘 / 全額 -->

    <div class="settlement-type-selector">

      <button
        id="splitBtn"
        class="settlement-type-btn active"
        onclick="setSettlementType('split')">
        割勘（1/2）
      </button>

      <button
        id="fullBtn"
        class="settlement-type-btn"
        onclick="setSettlementType('full')">
        全額
      </button>

    </div>


    <!-- 電卓 -->

    <div class="calculator">

      <button
        class="calc-btn clear"
        onclick="clearCalculator()">
        AC
      </button>

      <button
        class="calc-btn"
        onclick="backspace()">
        ⌫
      </button>

      <button
        class="calc-btn operator"
        onclick="inputOperator('÷')">
        ÷
      </button>

      <button
        class="calc-btn operator"
        onclick="inputOperator('×')">
        ×
      </button>


      <button
        class="calc-btn"
        onclick="inputNumber('7')">
        7
      </button>

      <button
        class="calc-btn"
        onclick="inputNumber('8')">
        8
      </button>

      <button
        class="calc-btn"
        onclick="inputNumber('9')">
        9
      </button>

      <button
        class="calc-btn operator"
        onclick="inputOperator('-')">
        −
      </button>


      <button
        class="calc-btn"
        onclick="inputNumber('4')">
        4
      </button>

      <button
        class="calc-btn"
        onclick="inputNumber('5')">
        5
      </button>

      <button
        class="calc-btn"
        onclick="inputNumber('6')">
        6
      </button>

      <button
        class="calc-btn operator"
        onclick="inputOperator('+')">
        ＋
      </button>


      <button
        class="calc-btn"
        onclick="inputNumber('1')">
        1
      </button>

      <button
        class="calc-btn"
        onclick="inputNumber('2')">
        2
      </button>

      <button
        class="calc-btn"
        onclick="inputNumber('3')">
        3
      </button>

      <button
        class="calc-btn equal"
        onclick="calculate()">
        ＝
      </button>


      <button
        class="calc-btn zero"
        onclick="inputNumber('0')">
        0
      </button>

      <button
        class="calc-btn"
        onclick="inputNumber('00')">
        00
      </button>

      <button
        class="calc-btn"
        onclick="inputNumber('000')">
        000
      </button>

      <button
        class="calc-btn"
        onclick="inputDecimal()">
        .
      </button>

    </div>


    <!-- 登録 -->

    <button
      class="register-btn"
      onclick="registerPayment()">
      ＋ 支払いを登録
    </button>

  </div>

</section>


<!-- =========================
     明細
========================= -->

<section class="detail-section">

  <div class="detail-card">

    <div class="detail-header">

      <div class="detail-title">
        支払い明細
      </div>

      <div
        id="detailCount"
        class="detail-count">
        0件
      </div>

    </div>


    <div
      id="detailList"
      class="detail-list">
    </div>

  </div>

</section>


<script>

/* =========================================================
   データ
========================================================= */

const STORAGE_KEY = "couple-travel-expense-v1";

let payments = [];

try {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (saved) {
    payments = JSON.parse(saved);
  }

} catch (e) {

  console.error(e);

  payments = [];

}


/* =========================================================
   電卓状態
========================================================= */

let calculatorValue = "0";

let firstValue = null;

let currentOperator = null;

let waitingForSecondValue = false;

let expressionText = "";


/* =========================================================
   精算区分
========================================================= */

/*
 * split = 割勘（登録金額の1/2を精算対象）
 * full  = 全額（登録金額の100%を精算対象）
 */

let settlementType = "split";


/* =========================================================
   DOM
========================================================= */

const amountDisplay =
  document.getElementById("amountDisplay");

const expression =
  document.getElementById("expression");

const itemName =
  document.getElementById("itemName");


/* =========================================================
   保存
========================================================= */

function savePayments() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(payments)
  );

}


/* =========================================================
   金額表示
========================================================= */

function formatMoney(value) {

  return Math.round(value).toLocaleString("ja-JP") + "円";

}


/* =========================================================
   電卓表示更新
========================================================= */

function updateCalculatorDisplay() {

  const numericValue =
    Number(calculatorValue);

  if (
    Number.isFinite(numericValue)
  ) {

    amountDisplay.textContent =
      numericValue.toLocaleString("ja-JP");

  } else {

    amountDisplay.textContent =
      calculatorValue;

  }

  expression.textContent =
    expressionText;

}


/* =========================================================
   数字
========================================================= */

function inputNumber(num) {

  if (waitingForSecondValue) {

    calculatorValue = num;

    waitingForSecondValue = false;

  } else {

    /*
     * 00 / 000 を押したときも、
     * 先頭が0だけなら通常の数字と同様に扱う。
     */

    if (calculatorValue === "0") {

      if (
        num === "00" ||
        num === "000"
      ) {

        calculatorValue = "0";

      } else {

        calculatorValue = num;

      }

    } else {

      calculatorValue += num;

    }

  }

  updateCalculatorDisplay();

}


/* =========================================================
   小数
========================================================= */

function inputDecimal() {

  if (waitingForSecondValue) {

    calculatorValue = "0.";

    waitingForSecondValue = false;

  } else if (
    !calculatorValue.includes(".")
  ) {

    calculatorValue += ".";

  }

  updateCalculatorDisplay();

}


/* =========================================================
   演算子
========================================================= */

function inputOperator(operator) {

  const inputValue =
    Number(calculatorValue);

  if (!Number.isFinite(inputValue)) {
    return;
  }


  if (
    firstValue !== null &&
    currentOperator &&
    !waitingForSecondValue
  ) {

    const result =
      performCalculation(
        firstValue,
        inputValue,
        currentOperator
      );

    if (result === null) {
      return;
    }

    calculatorValue =
      String(result);

    firstValue =
      result;

  } else {

    firstValue =
      inputValue;

  }


  currentOperator =
    operator;

  waitingForSecondValue = true;


  expressionText =
    `${formatNumberForExpression(firstValue)} ${operator}`;

  updateCalculatorDisplay();

}


/* =========================================================
   計算
========================================================= */

function calculate() {

  if (
    firstValue === null ||
    currentOperator === null ||
    waitingForSecondValue
  ) {

    return;

  }


  const secondValue =
    Number(calculatorValue);


  const result =
    performCalculation(
      firstValue,
      secondValue,
      currentOperator
    );


  if (result === null) {
    return;
  }


  expressionText =
    `${formatNumberForExpression(firstValue)} ${currentOperator} ${formatNumberForExpression(secondValue)} =`;


  calculatorValue =
    String(result);

  firstValue = null;

  currentOperator = null;

  waitingForSecondValue = true;

  updateCalculatorDisplay();

}


/* =========================================================
   四則演算
========================================================= */

function performCalculation(a, b, operator) {

  switch (operator) {

    case "+":
      return a + b;

    case "-":
      return a - b;

    case "×":
      return a * b;

    case "÷":

      if (b === 0) {

        alert("0で割ることはできません。");

        clearCalculator();

        return null;

      }

      return a / b;

    default:
      return b;

  }

}


/* =========================================================
   電卓クリア
========================================================= */

function clearCalculator() {

  calculatorValue = "0";

  firstValue = null;

  currentOperator = null;

  waitingForSecondValue = false;

  expressionText = "";

  updateCalculatorDisplay();

}


/* =========================================================
   バックスペース
========================================================= */

function backspace() {

  if (waitingForSecondValue) {
    return;
  }


  if (
    calculatorValue.length <= 1
  ) {

    calculatorValue = "0";

  } else {

    calculatorValue =
      calculatorValue.slice(0, -1);

  }


  updateCalculatorDisplay();

}


/* =========================================================
   式用数字
========================================================= */

function formatNumberForExpression(value) {

  return Number(value).toLocaleString("ja-JP");

}


/* =========================================================
   割勘 / 全額 切替
========================================================= */

function setSettlementType(type) {

  if (
    type !== "split" &&
    type !== "full"
  ) {

    return;

  }


  settlementType = type;


  const splitBtn =
    document.getElementById("splitBtn");

  const fullBtn =
    document.getElementById("fullBtn");


  splitBtn.classList.toggle(
    "active",
    type === "split"
  );

  fullBtn.classList.toggle(
    "active",
    type === "full"
  );

}


/* =========================================================
   精算対象額
========================================================= */

function getSettlementAmount(payment) {

  /*
   * 既存データには settlementType がないため、
   * その場合は従来どおり「割勘」として扱う。
   */

  const type =
    payment.settlementType || "split";


  if (type === "full") {

    return payment.amount;

  }


  return payment.amount / 2;

}


/* =========================================================
   支払い登録
========================================================= */

function registerPayment() {

  const payer =
    document.querySelector(
      'input[name="payer"]:checked'
    ).value;


  const name =
    itemName.value.trim();


  let amount =
    Number(calculatorValue);


  /* 未計算の式がある場合 */

  if (
    firstValue !== null &&
    currentOperator !== null &&
    !waitingForSecondValue
  ) {

    calculate();

    amount =
      Number(calculatorValue);

  }


  if (!name) {

    alert("支払い名目を入力してください。");

    itemName.focus();

    return;

  }


  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {

    alert("1円以上の金額を入力してください。");

    return;

  }


  const payment = {

    id:
      Date.now().toString() +
      Math.random().toString(16).slice(2),

    payer: payer,

    name: name,

    amount: amount,

    settlementType:
      settlementType,

    createdAt:
      new Date().toISOString()

  };


  payments.push(payment);

  savePayments();

  render();


  /* 入力リセット */

  itemName.value = "";

  clearCalculator();

  /*
   * 次の入力も「割勘」を初期状態に戻す
   */

  setSettlementType("split");


  /* 名目欄に戻す */

  itemName.focus();

}


/* =========================================================
   明細削除
========================================================= */

function deletePayment(id) {

  const payment =
    payments.find(
      item => item.id === id
    );


  if (!payment) {
    return;
  }


  const message =
    `「${payment.name}」${formatMoney(payment.amount)}を削除しますか？`;


  if (!confirm(message)) {
    return;
  }


  payments =
    payments.filter(
      item => item.id !== id
    );


  savePayments();

  render();

}


/* =========================================================
   全削除
========================================================= */

function clearAll() {

  if (payments.length === 0) {

    alert("削除するデータがありません。");

    return;

  }


  const result =
    confirm(
      "登録した支払いをすべて削除します。\n\nこの操作は元に戻せません。よろしいですか？"
    );


  if (!result) {
    return;
  }


  payments = [];

  savePayments();

  render();

}


/* =========================================================
   合計
========================================================= */

function calculateTotals() {

  let husbandTotal = 0;

  let wifeTotal = 0;


  payments.forEach(payment => {

    const settlementAmount =
      getSettlementAmount(payment);


    if (payment.payer === "husband") {

      husbandTotal += settlementAmount;

    } else {

      wifeTotal += settlementAmount;

    }

  });


  return {
    husbandTotal,
    wifeTotal
  };

}


/* =========================================================
   精算表示
========================================================= */

function renderSettlement(
  husbandTotal,
  wifeTotal
) {

  const box =
    document.getElementById(
      "settlementBox"
    );

  const result =
    document.getElementById(
      "settlementResult"
    );


  const difference =
    husbandTotal - wifeTotal;


  box.classList.remove("none");


  if (
    husbandTotal === 0 &&
    wifeTotal === 0
  ) {

    result.textContent =
      "まだ支払いがありません";

    return;

  }


  if (
    Math.abs(difference) < 0.000001
  ) {

    result.textContent =
      "精算なし（支払額は同じです）";

    box.classList.add("none");

    return;

  }


  /*
   * すでに各明細について
   * 「割勘 = 1/2」
   * 「全額 = 1/1」
   * として精算対象額を算出している。
   *
   * その差額を2人で均等化するため、
   * 差額の半分を精算する。
   */

  const settlement =
    Math.abs(difference);


  if (difference > 0) {

    result.textContent =
      `皐月 → 一正へ ${formatMoney(settlement)}`;

  } else {

    result.textContent =
      `一正 → 皐月へ ${formatMoney(settlement)}`;

  }

}


/* =========================================================
   明細表示
========================================================= */

function renderDetails() {

  const list =
    document.getElementById(
      "detailList"
    );


  const count =
    document.getElementById(
      "detailCount"
    );


  count.textContent =
    `${payments.length}件`;


  list.innerHTML = "";


  if (payments.length === 0) {

    list.innerHTML =
      `<div class="empty">
        まだ支払いが登録されていません
      </div>`;

    return;

  }


  /*
   * 新しいものを上に表示
   */

  const sorted =
    [...payments].reverse();


  sorted.forEach(payment => {

    const item =
      document.createElement("div");

    item.className =
      "detail-item";


    const person =
      document.createElement("div");

    person.className =
      "detail-person " +
      (
        payment.payer === "husband"
          ? "husband"
          : "wife"
      );

    person.textContent =
      payment.payer === "husband"
        ? "一正"
        : "皐月";


    const content =
      document.createElement("div");

    content.className =
      "detail-content";


    const name =
      document.createElement("div");

    name.className =
      "detail-name";

    name.textContent =
      payment.name;


    const date =
      document.createElement("div");

    date.className =
      "detail-date";

    date.textContent =
      formatDate(
        payment.createdAt
      );


    content.appendChild(name);

    content.appendChild(date);


    /*
     * 金額・精算区分
     */

    const amount =
      document.createElement("div");

    amount.className =
      "detail-amount";


    const amountValue =
      document.createElement("div");

    amountValue.className =
      "detail-amount-value";

    amountValue.textContent =
      formatMoney(payment.amount);


    const badge =
      document.createElement("span");

    const type =
      payment.settlementType || "split";


    badge.className =
      "settlement-badge " +
      (
        type === "full"
          ? "full"
          : "split"
      );

    badge.textContent =
      type === "full"
        ? "全額"
        : "割勘";


    amount.appendChild(amountValue);

    amount.appendChild(badge);


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-item";

    deleteButton.textContent =
      "×";

    deleteButton.onclick =
      () => deletePayment(payment.id);


    item.appendChild(person);

    item.appendChild(content);

    item.appendChild(amount);

    item.appendChild(deleteButton);


    list.appendChild(item);

  });

}


/* =========================================================
   日付
========================================================= */

function formatDate(dateString) {

  const date =
    new Date(dateString);


  if (Number.isNaN(date.getTime())) {
    return "";
  }


  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      date.getDate()
    ).padStart(2, "0");

  const hours =
    String(
      date.getHours()
    ).padStart(2, "0");

  const minutes =
    String(
      date.getMinutes()
    ).padStart(2, "0");


  return `${y}/${m}/${d} ${hours}:${minutes}`;

}


/* =========================================================
   CSV用エスケープ
========================================================= */

function escapeCSV(value) {

  const text =
    String(
      value === null ||
      value === undefined
        ? ""
        : value
    );


  /*
   * CSVでは
   * カンマ、改行、ダブルクォート
   * が含まれる場合、全体をダブルクォートで囲む。
   */

  if (
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n") ||
    text.includes("\r")
  ) {

    return '"' +
      text.replace(/"/g, '""') +
      '"';

  }


  return text;

}


/* =========================================================
   CSV出力
========================================================= */

function exportCSV() {

  if (payments.length === 0) {

    alert("CSV出力する支払いデータがありません。");

    return;

  }


  const headers = [
    "登録日時",
    "支払者",
    "支払い名目",
    "支払額",
    "精算区分",
    "精算対象額"
  ];


  const rows =
    payments.map(payment => {

      const settlementAmount =
        getSettlementAmount(payment);


      const type =
        payment.settlementType || "split";


      return [

        formatDate(payment.createdAt),

        payment.payer === "husband"
          ? "一正"
          : "皐月",

        payment.name,

        Math.round(payment.amount),

        type === "full"
          ? "全額"
          : "割勘",

        Math.round(settlementAmount)

      ];

    });


  const csvRows = [];


  csvRows.push(
    headers.map(escapeCSV).join(",")
  );


  rows.forEach(row => {

    csvRows.push(
      row.map(escapeCSV).join(",")
    );

  });


  /*
   * BOMを付けることで、
   * Excelでも日本語が文字化けしにくくする。
   */

  const csv =
    "\uFEFF" +
    csvRows.join("\r\n");


  const blob =
    new Blob(
      [csv],
      {
        type: "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");

  link.href = url;

  const now =
    new Date();


  const fileDate =
    now.getFullYear() +
    String(
      now.getMonth() + 1
    ).padStart(2, "0") +
    String(
      now.getDate()
    ).padStart(2, "0");


  link.download =
    `立替精算_${fileDate}.csv`;


  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);


  /*
   * 少し待ってからURLを解放
   */

  setTimeout(() => {

    URL.revokeObjectURL(url);

  }, 1000);

}


/* =========================================================
   全画面更新
========================================================= */

function render() {

  const totals =
    calculateTotals();


  document.getElementById(
    "husbandTotal"
  ).textContent =
    formatMoney(
      totals.husbandTotal
    );


  document.getElementById(
    "wifeTotal"
  ).textContent =
    formatMoney(
      totals.wifeTotal
    );


  renderSettlement(
    totals.husbandTotal,
    totals.wifeTotal
  );


  renderDetails();

}


/* =========================================================
   キーボード対応
   PCでテストするとき用
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    /*
     * 重要：
     * 文字入力欄などにフォーカスしているときは、
     * Backspace等を電卓操作に使わない。
     *
     * これによりスマホの文字入力欄で
     * 文字を削除した際、電卓の数字まで
     * 削除される問題を防ぐ。
     */

    const target =
      event.target;


    const isTextInput =
      target instanceof HTMLInputElement ||
      target instanceof HTMLTextAreaElement ||
      target.isContentEditable;


    if (isTextInput) {

      return;

    }


    const key =
      event.key;


    if (/^[0-9]$/.test(key)) {

      inputNumber(key);

      return;

    }


    if (key === ".") {

      inputDecimal();

      return;

    }


    if (
      key === "+" ||
      key === "-"
    ) {

      inputOperator(key);

      return;

    }


    if (key === "*") {

      inputOperator("×");

      return;

    }


    if (key === "/") {

      event.preventDefault();

      inputOperator("÷");

      return;

    }


    if (
      key === "Enter" ||
      key === "="
    ) {

      calculate();

      return;

    }


    if (key === "Backspace") {

      backspace();

      return;

    }


    if (key === "Escape") {

      clearCalculator();

    }

  }
);


/* =========================================================
   初期表示
========================================================= */

setSettlementType("split");

updateCalculatorDisplay();

render();

</script>
